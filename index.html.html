<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мемори ЖКТ</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Nunito', sans-serif;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #f0f0f0;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }
        
        #startScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: url('start.png') center center/cover no-repeat;
            z-index: 1000;
            cursor: pointer;
        }
        
        #startScreen.hidden {
            display: none;
        }
        
        h1 { 
            color: #2c3e50; 
            font-weight: 700;
            margin: 10px 0;
        }
        
        .stats { 
            margin: 10px 0 20px; 
            font-size: 1.2rem; 
            font-weight: 700;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 100px);
            gap: 10px;
        }
        
        .card {
            width: 100px;
            height: 100px;
            background: url('card-back.png') center center/cover no-repeat;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        .card.flipped {
            background: white;
            border: 2px solid #3498db;
            cursor: default;
        }
        
        .card.flipped img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .card.matched {
            border: 3px solid #2ecc71;
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.6);
            cursor: default;
            background: white;
        }
        
        .card.matched img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        button {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 1rem;
            background: #ff6b35;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-family: 'Nunito', sans-serif;
        }
        
        button:hover { 
            background: #ff5722; 
        }
        
        #victoryScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        #victoryScreen.show {
            display: flex;
        }
        
        #victoryVideo {
            max-width: 90%;
            max-height: 70%;
            border-radius: 10px;
        }
        
        #closeVictory {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div id="startScreen"></div>
    
    <h1> Мемори: Органы ЖКТ</h1>
    <div class="stats">Ходы: <span id="moves">0</span></div>
    <div class="grid" id="grid"></div>
    <button onclick="initGame()">🔄 Заново</button>
    
    <div id="victoryScreen">
        <video id="victoryVideo" controls>
            <source src="victory.mp4" type="video/mp4">
        </video>
        <button id="closeVictory" onclick="closeVictory()">Играть снова</button>
    </div>

    <script>
        const cardImages = [
            'stomach.png',
            'liver.png',
            'intestine.png',
            'pancreas.png',
            'esophagus.png',
            'gallbladder.png',
            'colon.png',
            'duodenum.png'
        ];
        
        let cards = [];
        let firstCard = null;
        let secondCard = null;
        let lockBoard = false;
        let moves = 0;

        document.getElementById('startScreen').addEventListener('click', function() {
            this.classList.add('hidden');
        });

        function initGame() {
            moves = 0;
            document.getElementById('moves').innerText = 0;
            firstCard = null;
            secondCard = null;
            lockBoard = false;
            
            cards = [...cardImages, ...cardImages];
            cards.sort(() => Math.random() - 0.5);
            
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            cards.forEach((img, i) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.img = img;
                card.dataset.index = i;
                card.onclick = () => flipCard(card);
                grid.appendChild(card);
            });
        }

        function flipCard(card) {
            if (lockBoard) return;
            if (card.classList.contains('flipped')) return;
            if (card.classList.contains('matched')) return;
            
            card.classList.add('flipped');
            card.innerHTML = `<img src="${card.dataset.img}" alt="Орган">`;
            
            if (!firstCard) {
                firstCard = card;
                return;
            }
            
            secondCard = card;
            moves++;
            document.getElementById('moves').innerText = moves;
            
            checkForMatch();
        }

        function checkForMatch() {
            const isMatch = firstCard.dataset.img === secondCard.dataset.img;
            
            if (isMatch) {
                firstCard.classList.add('matched');
                secondCard.classList.add('matched');
                resetSelection();
                
                const matchedCount = document.querySelectorAll('.card.matched').length;
                if (matchedCount === cards.length) {
                    setTimeout(showVictory, 600);
                }
            } else {
                lockBoard = true;
                
                // Мгновенный возврат к рубашке — без задержек и анимаций
                setTimeout(() => {
                    firstCard.classList.remove('flipped');
                    secondCard.classList.remove('flipped');
                    firstCard.innerHTML = '';
                    secondCard.innerHTML = '';
                    resetSelection();
                }, 800);
            }
        }

        function resetSelection() {
            firstCard = null;
            secondCard = null;
            lockBoard = false;
        }

        function showVictory() {
            document.getElementById('victoryScreen').classList.add('show');
            const video = document.getElementById('victoryVideo');
            video.currentTime = 0;
            video.play();
        }

        function closeVictory() {
            document.getElementById('victoryScreen').classList.remove('show');
            const video = document.getElementById('victoryVideo');
            video.pause();
            initGame();
        }

        initGame();
    </script>
</body>
</html>
